<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deki Event Registration</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Animated Background */
.bg {
    position: fixed;
    width: 100%;
    height: 100%;
    overflow: hidden;
    top: 0;
    left: 0;
    z-index: -1;
}

.bg span {
    position: absolute;
    width: 20px;
    height: 20px;
    background: rgba(255,255,255,0.2);
    animation: move 20s linear infinite;
    bottom: -150px;
    border-radius: 50%;
}

.bg span:nth-child(1){left:10%; width:40px; height:40px;}
.bg span:nth-child(2){left:20%;}
.bg span:nth-child(3){left:30%; width:25px; height:25px;}
.bg span:nth-child(4){left:40%;}
.bg span:nth-child(5){left:50%; width:30px; height:30px;}
.bg span:nth-child(6){left:60%;}
.bg span:nth-child(7){left:70%; width:35px; height:35px;}
.bg span:nth-child(8){left:80%;}
.bg span:nth-child(9){left:90%;}
.bg span:nth-child(10){left:25%;}

@keyframes move {
    0% {transform: translateY(0) rotate(0deg); opacity: 1;}
    100% {transform: translateY(-1000px) rotate(720deg); opacity: 0;}
}

/* Container */
.container {
    width: 380px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    padding: 30px;
    color: white;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    animation: fadeIn 1s ease;
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: none;
    border-radius: 8px;
    outline: none;
}

button {
    width: 100%;
    padding: 12px;
    background: #ff7eb3;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #ff4f91;
    transform: scale(1.05);
}

#successPage {
    display: none;
    text-align: center;
}

.success {
    font-size: 20px;
    margin-bottom: 15px;
    color: #00ffcc;
}

.info {
    background: rgba(255,255,255,0.2);
    padding: 10px;
    border-radius: 8px;
    margin: 8px 0;
}

/* Footer */
.footer {
    position: fixed;
    bottom: 10px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 14px;
    opacity: 0.8;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<!-- Background Animation -->
<div class="bg">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
</div>

<!-- FORM -->
<div class="container" id="formPage">
    <h2>🎉 Register Event</h2>

    <form id="regForm">
        <input type="text" id="name" placeholder="👤 Full Name" required>
        <input type="email" id="email" placeholder="📧 Email" required>
        <input type="tel" id="phone" placeholder="📱 Phone Number" required>

        <select id="event" required>
            <option value="">🎯 Select Event</option>
            <option>Tech Seminar</option>
            <option>Workshop</option>
            <option>Coding Contest</option>
        </select>

        <button type="submit">🚀 Register Now</button>
    </form>
</div>

<!-- SUCCESS PAGE -->
<div class="container" id="successPage">
    <h2>🎉 Success!</h2>
    <p class="success">Registration Completed ✅</p>

    <div class="info">👤 <span id="sName"></span></div>
    <div class="info">📧 <span id="sEmail"></span></div>
    <div class="info">🎯 <span id="sEvent"></span></div>

    <button onclick="goBack()">🔁 Register Again</button>
</div>

<!-- FOOTER -->
<footer class="footer">
    © 2026 Deki ❤️ | All Rights Reserved
</footer>

<script>
document.getElementById("regForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;
    let event = document.getElementById("event").value;

    if(name && email && phone && event) {

        localStorage.setItem("user", JSON.stringify({name,email,phone,event}));

        document.getElementById("formPage").style.display = "none";
        document.getElementById("successPage").style.display = "block";

        document.getElementById("sName").innerText = name;
        document.getElementById("sEmail").innerText = email;
        document.getElementById("sEvent").innerText = event;
    }
});

function goBack() {
    document.getElementById("formPage").style.display = "block";
    document.getElementById("successPage").style.display = "none";
}
</script>

</body>
</html>
